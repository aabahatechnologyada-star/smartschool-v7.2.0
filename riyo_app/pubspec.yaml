name: riyo_app
description: Riyo school mobile app for students/parents (Android + iOS).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  http_mock_adapter: ^0.5.0
  test: ^1.24.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/riyo_logo.png
    - assets/riyo_logo_small.png
