name: Test & Build

on:
  push:
    branches: [main, riyo-mobile-app]
    paths:
      - 'riyo_app/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'riyo_app/**'
  workflow_dispatch:

jobs:
  # Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            flutter pub get && break || sleep 10
          done

      - name: Run unit tests
        run: flutter test test/ --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: riyo_app/coverage/lcov.info

  # Android APK
  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Stash app sources
        run: |
          mv lib /tmp/_lib && mv assets /tmp/_assets && mv pubspec.yaml /tmp/_pubspec.yaml && mv l10n.yaml /tmp/_l10n.yaml || true

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml
          rm -f l10n.yaml && mv /tmp/_l10n.yaml ./l10n.yaml || true

      - name: Remove generated test/ and README.md
        run: |
          rm -rf test README.md || true

      - name: Patch Android permissions (INTERNET, cleartext, network state)
        run: python3 tool/patch_perms.py android || true

      - name: Generate localizations
        run: flutter gen-l10n --verbose

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            flutter pub get && break || sleep 10
          done

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: |
          mkdir -p build
          flutter build apk --release 2>&1 | tee build/android-build.log

      - name: Debug APK paths
        if: success()
        run: |
          echo "=== Debug APK paths from repo root ==="
          find riyo_app/build -name "*.apk" -type f 2>/dev/null || echo "No APKs found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-apk
          path: |
            riyo_app/build/app/outputs/flutter-apk/*.apk
            riyo_app/build/app/outputs/flutter-apk/**/*.apk
            riyo_app/build/app/outputs/**/*.apk
            riyo_app/build/**/*.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            riyo_app/build/**/*.log
            riyo_app/android/**/*.log
            riyo_app/.dart_tool/**/*.log

  # iOS
  build-ios:
    name: Build iOS (unsigned)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup CocoaPods
        run: sudo gem install cocoapods --no-document || pod --version

      - name: Stash app sources
        run: |
          mv lib /tmp/_lib && mv assets /tmp/_assets && mv pubspec.yaml /tmp/_pubspec.yaml && mv l10n.yaml /tmp/_l10n.yaml || true

      - name: Generate iOS project
        run: flutter create --platforms=ios --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml
          rm -f l10n.yaml && mv /tmp/_l10n.yaml ./l10n.yaml || true

      - name: Remove generated test/ and README.md
        run: rm -rf test README.md || true

      - name: Patch iOS Info.plist
        run: python3 tool/patch_perms.py ios

      - name: Generate localizations
        run: flutter gen-l10n --verbose

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            flutter pub get && break || sleep 10
          done

      - name: Install iOS pods
        run: cd ios && pod install && cd ..

      - name: Build iOS (release, no codesign)
        run: |
          mkdir -p build
          flutter build ios --release --no-codesign 2>&1 | tee build/ios-build.log

      - name: List iOS outputs (debug)
        if: success()
        run: |
          echo "=== build/ios ==="
          find riyo_app/build/ios -type f -name "*.app" 2>/dev/null || echo "No .app found"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-ios
          path: riyo_app/build/ios/iphoneos/Runner.app
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            riyo_app/build/**/*.log
            riyo_app/ios/**/*.log
            riyo_app/.dart_tool/**/*.log