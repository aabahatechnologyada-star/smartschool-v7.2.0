name: Build & Verify Riyo App

on:
  push:
    branches: [main, riyo-mobile-app]
    paths:
      - 'riyo_app/**'
      - '.github/workflows/build_app.yml'
  pull_request:
    paths:
      - 'riyo_app/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Stash app sources
        run: |
          mv lib /tmp/_lib
          mv assets /tmp/_assets
          mv pubspec.yaml /tmp/_pubspec.yaml
          [ -f l10n.yaml ] && mv l10n.yaml /tmp/_l10n.yaml || true
          ls -la

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml
          [ -f /tmp/_l10n.yaml ] && mv /tmp/_l10n.yaml ./l10n.yaml || true
          ls -la

      - name: Remove generated test/ and README.md
        run: rm -rf test README.md || true

      - name: Patch Android permissions
        run: python3 tool/patch_perms.py android || echo "Patch failed, continuing"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release 2>&1 | tee build/android-build.log

      - name: Debug - List all APK files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== build/app/outputs ==="
          ls -la build/app/outputs/ || echo "Not found"
          echo "=== build/app/outputs/flutter-apk ==="
          ls -la build/app/outputs/flutter-apk/ || echo "Not found"
          echo "=== All APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-apk
          path: |
            riyo_app/build/app/outputs/flutter-apk/*.apk
            riyo_app/build/app/outputs/flutter-apk/**/*.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: riyo_app/build/**/*.log
          if-no-files-found: ignore

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: riyo_app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Setup CocoaPods
        run: sudo gem install cocoapods --no-document || true

      - name: Stash app sources
        run: |
          mv lib /tmp/_lib
          mv assets /tmp/_assets
          mv pubspec.yaml /tmp/_pubspec.yaml
          [ -f l10n.yaml ] && mv l10n.yaml /tmp/_l10n.yaml || true

      - name: Generate iOS project
        run: flutter create --platforms=ios --org=com.riyo --project-name=riyo_app .

      - name: Restore app sources
        run: |
          rm -rf lib && mv /tmp/_lib ./lib
          rm -rf assets && mv /tmp/_assets ./assets
          rm -f pubspec.yaml && mv /tmp/_pubspec.yaml ./pubspec.yaml
          [ -f /tmp/_l10n.yaml ] && mv /tmp/_l10n.yaml ./l10n.yaml || true

      - name: Remove generated test/ and README.md
        run: rm -rf test README.md || true

      - name: Patch iOS Info.plist
        run: python3 tool/patch_perms.py ios || echo "Patch failed, continuing"

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS pods
        run: cd ios && pod install && cd ..

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign 2>&1 | tee build/ios-build.log

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: riyo-app-release-ios
          path: riyo_app/build/ios/iphoneos/Runner.app
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: riyo_app/build/**/*.log
          if-no-files-found: ignore
